<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres</title>
    <link rel="stylesheet" href="style.css?v=2026111524">
    <link rel="stylesheet" href="../../styles/apple.css?v=2026111524">
    <link rel="stylesheet" href="apple.css?v=2026111524">
    <script src="../../utils/icons.js?v=2026111524"></script>

</head>

<body>
    <!-- Header -->
    <div id="header">
        <img id="headerLogo" src="../../resources/logo.png" style="height: 40px;" />
        <label id="widgetTitle"></label>
        <button id="membershipsButton" onclick="OpenMembershipPage()">Découvrez les widgets de nutty</button>
        <div id="widgetUrlInputWrapper">
            <span id="urlLabel">Cliquez pour copier l’URL</span>
            <input id="widgetUrlInput" type="text" readonly onclick="CopyURLToClipboard()">

        </div>
        <button id="loadDefaultsButton" onclick="OpenLoadDefaultsPopup()" title="Charger les paramètres par défaut"><svg viewBox="0 0 29 34" aria-hidden="true"><path d="M25.47 16.78C25.47 19.94 24.16 22.7899 22.04 24.82C21.37 25.5599 21.49 26.27 21.91 26.76C22.39 27.3099 23.34 27.4599 24.01 26.75C26.62 24.24 28.24 20.69 28.24 16.78C28.24 9.81995 23.21 4.03995 16.57 2.86995V1.01995C16.57 -0.0100486 15.82 -0.27005 15.04 0.28995L10.62 3.45995C10.01 3.89995 10.02 4.57995 10.62 5.01995L15.05 8.18995C15.82 8.73995 16.57 8.47995 16.57 7.46995V5.69995C21.67 6.82995 25.47 11.35 25.47 16.78ZM2.77 16.78C2.77 13.62 4.09 10.76 6.2 8.73995C6.87 7.99995 6.76 7.27995 6.33 6.79995C5.85 6.24995 4.91 6.08995 4.24 6.79995C1.62 9.30995 0 12.87 0 16.78C0 23.74 5.03 29.51 11.67 30.68V32.54C11.67 33.57 12.44 33.83 13.2 33.27L17.62 30.1C18.24 29.64 18.22 28.96 17.62 28.54L13.19 25.36C12.44 24.82 11.67 25.08 11.67 26.09V27.85C6.57 26.7299 2.77 22.21 2.77 16.78Z"/></svg>Charger les paramètres par défaut</button>
        <button id="loadSettingsButton" onclick="OpenLoadSettingsPopup()" title="Charger des paramètres depuis une URL"><svg viewBox="0 0 33 24" aria-hidden="true"><path d="M4.48 23.86H28.01C30.96 23.86 32.49 22.34 32.49 19.41V11.35C32.49 9.84 32.32 9.15 31.59 8.27L26.9 2.57C25.3 0.620002 24.44 0 22.13 0H10.36C8.05 0 7.19 0.63 5.57 2.58L0.9 8.27C0.19 9.15 0 9.84 0 11.35V19.41C0 22.34 1.53 23.86 4.48 23.86ZM3.33 10.23C2.89 10.23 2.8 9.84 3.03 9.56L8.01 3.35C8.62 2.57 9.32 2.24 10.25 2.24H22.24C23.17 2.24 23.87 2.57 24.48 3.35L29.47 9.56C29.69 9.84 29.6 10.23 29.16 10.23H20.3C19.57 10.23 19.25 10.73 19.25 11.28V11.32C19.25 12.81 18.1 14.4 16.25 14.4C14.39 14.4 13.24 12.81 13.24 11.32V11.28C13.24 10.73 12.92 10.23 12.21 10.23H3.33ZM4.6 21.18C3.33 21.18 2.64 20.52 2.64 19.2V12.59H10.93C11.36 15.04 13.48 16.86 16.25 16.86C19.01 16.86 21.13 15.04 21.56 12.59H29.86V19.2C29.86 20.52 29.14 21.18 27.89 21.18H4.6Z"/></svg>Charger des paramètres</button>
        <button id="schemeToggle" data-scheme-toggle></button>
    </div>

    <!-- Main Content Area -->
    <div id="contentArea">

        <!-- Settings Panel -->
        <div id="settingsPanel">
        </div>

        <!-- Widget Preview Panel -->
        <div id="widget-preview-wrapper">
            <label id="unmute-label">Cliquez pour réactiver le son...</label>
            <iframe id="widgetPreview">
            </iframe>
        </div>
    </div>

    <!-- Load Settings Popup -->
    <div id="loadSettingsWrapper">
        <div id="loadSettingsContainer">
            <h2>Charger des paramètres</h2>
            <label style="font-size: 0.8em;">Collez l’URL de votre widget existant</label>
            <input id="loadUrlBox" type="text" style="width: 100%;">
            <div style="display: flex; gap: 20px">
                <button id="cancelSettingsButton" onclick="CloseSettings()">Annuler</button>
                <button style="background-color: var(--accent-color);" onclick="LoadSettings()">Charger</button>
            </div>
        </div>
    </div>

    <div id="loadDefaultsWrapper">
        <div id="loadDefaultsContainer">
            <h2>Charger les valeurs par défaut</h2>
            <label style="font-size: 0.8em;">Êtes-vous sûr ?</label>
            <div style="display: flex; gap: 20px">
                <button id="cancelDefaultsButton" onclick="CloseDefaultsPopup()">Non</button>
                <button style="background-color: var(--accent-color);" onclick="LoadDefaultSettings()">Oui</button>
            </div>
        </div>
    </div>
</body>

</html>

<script src="../../utils/helpers.js"></script>
