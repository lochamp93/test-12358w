<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<!-- OBS garde la page en cache : rechargement automatique si une version plus récente est en ligne -->
	<script src="../-common/utils/fresh.js?v=2026111705" data-version="2026111705" data-version-url="version.txt"></script>
	<title>Giveaway</title>
	<link rel="icon" href="../-common/resources/favicon.png" type="image/png">
	<link rel="stylesheet" href="./style.css?v=2026111705" />
	<script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
</head>

<body>
	<div id="widget" class="layout-light">
		<div id="stage" data-view="none">
			<!-- Light : ligne décorative -->
			<div id="line"></div>

			<!-- Avant le tirage : compteur et/ou lot -->
			<div id="before" class="view">
				<img id="prizePhoto" class="prize-photo" alt="" />
				<div class="texts">
					<span id="title" class="secondary"></span>
					<span id="prizeName" class="strong"></span>
					<span id="count"></span>
					<span id="word" class="secondary"></span>
				</div>
			</div>

			<!-- Défilement des noms -->
			<div id="roll" class="view">
				<span id="rollLabel" class="secondary"></span>
				<div id="slot"><div id="strip"></div></div>
				<!-- Bandeau : bobine horizontale avec repère central -->
				<div id="reel"><div id="reelTrack"></div><i class="reel-marker"></i></div>
			</div>

			<!-- Gagnant·es -->
			<div id="winners" class="view"></div>
		</div>
		<canvas id="confetti"></canvas>
	</div>

	<script src="../-common/utils/widget-settings.js?v=2026111705"></script>
	<script src="./helpers.js?v=2026111705"></script>
	<script src="./script.js?v=2026111705"></script>
</body>

</html>
