<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Compteur de morts</title>
	<link rel="icon" href="../-common/resources/logo.png" type="image/png">
	<link rel="stylesheet" href="./style.css?v=2026111525" />
	<link id="googleFont" rel="stylesheet" href="" />
	<script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
</head>

<body>
	<div id="widget" class="hidden">
		<div id="box" class="layout-card">
			<!-- Carte : fond flouté à partir de la jaquette -->
			<div id="bgLayer"></div>

			<!-- Carte : jaquette du jeu -->
			<div id="coverWrap"><img id="cover" alt="" /></div>

			<div id="content">
				<!-- Minimal : ligne décorative -->
				<div id="decorLine"></div>
				<div id="mainRow">
					<div id="game" class="game"></div>
					<div id="core">
						<span id="label" class="label"></span>
						<span id="valueRow">
							<span id="icon"></span>
							<span id="countWrap"><span id="count">0</span></span>
						</span>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="../-common/utils/widget-settings.js?v=2026111525"></script>
	<script src="./helpers.js?v=2026111525"></script>
	<script src="./script.js?v=2026111525"></script>
</body>

</html>
