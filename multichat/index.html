<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Multichat</title>
  <meta charset="UTF-8" />
  <link rel="icon" href="../-common/resources/favicon.png" type="image/png" />
  <!-- Thème : rendu complet choisi par « orientation » et « theme » (Vertical / Standard par défaut).
       Bulles, Verre et Épuré partent du rendu Standard et ajoutent leur propre feuille ;
       l'horizontal (Ligne) a sa feuille et son gabarit à lui. -->
  <link id="themeStylesheet" rel="stylesheet" href="./themes/standard.css?v=2026112221" />
  <link id="themeExtraStylesheet" rel="stylesheet" disabled />
  <script>
    // Version des fichiers du widget : à changer à chaque mise à jour, pour qu'OBS
    // ne garde jamais un ancien script avec une nouvelle page (ou l'inverse)
    window.MultichatVersion = '2026112221';
    (function () {
      var params = new URLSearchParams(location.search);
      var THEMES = ['standard', 'encadre', 'bulles', 'verre', 'epure'];
      var EXTRA = ['bulles', 'verre', 'epure'];
      var horizontal = params.get('orientation') === 'horizontal';
      var t = params.get('theme');
      t = THEMES.indexOf(t) >= 0 ? t : 'standard';
      if (horizontal) t = 'ligne';
      window.MultichatOrientation = horizontal ? 'horizontal' : 'vertical';
      window.MultichatTheme = t;
      var base = document.getElementById('themeStylesheet');
      var extra = document.getElementById('themeExtraStylesheet');
      if (t === 'encadre' || t === 'ligne') base.href = './themes/' + t + '.css?v=' + window.MultichatVersion;
      if (EXTRA.indexOf(t) >= 0) { extra.href = './themes/' + t + '.css?v=' + window.MultichatVersion; extra.disabled = false; }
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.orientation = window.MultichatOrientation;
    })();
  </script>
  <script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
</head>
<body>
  <div id="statusContainer">Connexion...</div>

  <div id="mainContainer" class="slide-fade">
    <ul id="messageList"></ul>
    <ul id="IPutThisHereSoICanCalculateHowBigEachMessageIsSupposedToBeBeforeIAddItToTheMessageList"></ul>
  </div>

  <!-- Gabarit de message par thème : le script garde celui du thème choisi -->
  <template id="messageTemplate" data-theme="standard">
    <div id="messageContainer">
      <div class="message-contents">
        <div class="message-right">
          <!-- <div id="firstMessage"><span> ✨ Premier message dans le chat</span><span> de </span></div> -->
          <div id="sharedChat"><span id="sharedChatChannel"></span></div>

          <label id="userInfo" class="userinfo-row">
            <span id="avatar"></span>
            <span id="timestamp"></span>
            <span id="platform"></span>
            <span id="badgeList"></span>
            <span id="pronouns"></span>
            <span id="username"></span>
            <span id="colon-separator" style="display:none;">: </span>
            <br id="line-space" />
          </label>

          <div id="reply">
            <div>➥ Répond à <span id="replyUser"></span> : <span id="replyMsg"></span></div>
          </div>

          <span id="message"></span>
        </div>
      </div>
    </div>
  </template>
  <template id="messageTemplate-encadre" data-theme="encadre">
    <div id="messageContainer">
      <div class="message-contents">
        <div class="message-right">
          <!-- <div id="firstMessage"><span> ✨ Premier message dans le chat</span><span> de </span></div> -->
          <div id="sharedChat"><span id="sharedChatChannel"></span></div>

          <label id="userInfo" class="userinfo-row">
            <span id="avatarFrame"><span id="avatar"></span></span>
            <span id="platform"></span>
            <span id="username"></span>
            <span id="timestamp"></span>
            <span id="badgeList"></span>
            <span id="pronouns"></span>
            <span id="colon-separator" style="display:none;">: </span>
          </label>
          <br id="line-space" />

          <div id="reply">
            <div>➥ Répond à <span id="replyUser"></span> : <span id="replyMsg"></span></div>
          </div>

          <span id="message"></span>
        </div>
      </div>
    </div>
  </template>

  <!-- Thème horizontal « Ligne » : tout sur une ligne, sans forme autour (à la manière de nutty) -->
  <template id="messageTemplate-ligne" data-theme="ligne">
    <div id="messageContainer">
      <div class="message-contents">
        <div class="message-right">
          <div id="firstMessage"></div>
          <div id="sharedChat"><span id="sharedChatChannel"></span></div>
          <label id="userInfo" class="userinfo-row">
            <span id="platform"></span>
            <span id="avatar"></span>
            <span id="timestamp"></span>
            <span id="badgeList"></span>
            <span id="pronouns"></span>
            <span id="username"></span>
            <span id="colon-separator" style="display:none;">: </span>
            <br id="line-space" />
          </label>
          <div id="reply"><div><span id="replyUser"></span><span id="replyMsg"></span></div></div>
          <span id="message"></span>
        </div>
      </div>
    </div>
  </template>

  <template id="cardTemplate">
    <div id="card">
      <div class="message-contents add-this-class-to-the-thing-to-make-all-the-text-centered-vertically-because-that-looks-much-better">
        <div id="avatar"></div>
        <div class="message-right">
          <label id="header" class="userinfo-row">
            <span id="icon"></span>
            <span id="title"></span>
            <br id="line-space" />
          </label>
          <span id="content"></span>
        </div>
      </div>
    </div>
  </template>

  <template id="tiktok-gift-template">
    <div class="tiktok-gift tiktok">
      <img class="tiktok-gift-avatar" src="https://static-cdn.jtvnw.net/jtv_user_pictures/f632e0c6-38e2-4065-a29e-6ba9b3e8cacf-profile_image-300x300.png" />
      <div class="tiktok-gift-message">
        <span id="tiktok-gift-username" style="font-size:.9em; font-weight:700;"></span><br />
        <span style="font-size:.7em;">sent <span id="tiktok-gift-name"></span></span>
      </div>
      <img class="tiktok-gift-sticker" src="https://p19-webcast.tiktokcdn.com/img/maliva/webcast-va/3851a489dea62b3a9fe99f61de5470ae~tplv-obj.png" />
      <div id="tiktok-gift-repeat-count">x13</div>
    </div>
  </template>

  <template id="kick-gift-template">
    <div class="kick-gift kick">
      <img class="kick-gift-avatar" src="" />
      <div class="kick-gift-contents">
        <span id="kick-gift-username" style="font-weight:700;"></span><br />
        <div style="display:flex; flex-direction:row; align-items:center;">
          <span>sent <span id="kick-gift-name"></span></span>
          <img src="icons/badges/kick-kicks.svg" style="height:1em; padding-left:.5em; padding-right:.25em;">
          <span id="kick-gift-amount">13</span>
        </div>
        <div id="kick-gift-message"></div>
      </div>
      <img class="kick-gift-sticker" src="" />
    </div>
  </template>

  <script>
    // Thèmes Encadré et Ligne : leur gabarit remplace celui du thème Standard
    // (Bulles, Verre et Épuré gardent le gabarit Standard)
    (function () {
      var t = window.MultichatTheme;
      if (t !== 'encadre' && t !== 'ligne') return;
      var std = document.getElementById('messageTemplate');
      var own = document.getElementById('messageTemplate-' + t);
      std.id = 'messageTemplate-standard';
      own.id = 'messageTemplate';
    })();
  </script>
  <script src="./helpers.js?v=2026112221"></script>
  <script src="./script.js?v=2026112221"></script>
</body>
</html>
